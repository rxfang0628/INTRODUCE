<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" font-family="DejaVu Serif, serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
    </marker>
    <linearGradient id="confHeat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8d6"/><stop offset="100%" stop-color="#e8a020"/>
    </linearGradient>
  </defs>

  <text x="600" y="28" text-anchor="middle" font-size="17" font-weight="bold">CAPGF: conflict-aware pixel-gated fusion with optional C1-MS context gate</text>

  <!-- ===== inputs ===== -->
  <rect x="30" y="70" width="100" height="80" fill="url(#confHeat)" stroke="#b8860b" stroke-width="1.2" rx="3"/>
  <circle cx="80" cy="110" r="16" fill="#e87020" opacity="0.75"/>
  <text x="80" y="165" text-anchor="middle" font-size="11">Conflict K(p)</text>
  <text x="80" y="179" text-anchor="middle" font-size="10" fill="#666">from CBE</text>

  <rect x="30" y="220" width="100" height="70" fill="#dce9f7" stroke="#2c5fa8" stroke-width="1.2" rx="3"/>
  <text x="80" y="250" text-anchor="middle" font-size="11">Tex map T</text>
  <text x="80" y="266" text-anchor="middle" font-size="10" fill="#666">PatchCore distance</text>

  <rect x="30" y="320" width="100" height="70" fill="#f7e3e3" stroke="#a82c2c" stroke-width="1.2" rx="3"/>
  <text x="80" y="350" text-anchor="middle" font-size="11">Sem map S</text>
  <text x="80" y="366" text-anchor="middle" font-size="10" fill="#666">frozen CMGL</text>

  <rect x="30" y="420" width="100" height="70" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2" rx="3"/>
  <text x="80" y="450" text-anchor="middle" font-size="11">M_PFB</text>
  <text x="80" y="466" text-anchor="middle" font-size="10" fill="#666">evidence fusion</text>

  <!-- ===== multi-scale conflict ===== -->
  <line x1="130" y1="110" x2="175" y2="110" stroke="#444" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="180" y="70" width="220" height="90" fill="#fff8d6" stroke="#b8860b" stroke-width="1.3" rx="6"/>
  <text x="290" y="92" text-anchor="middle" font-size="12" font-weight="bold">Multi-scale conflict C(p)</text>
  <text x="290" y="112" text-anchor="middle" font-size="10">local: AvgPool 3×3</text>
  <text x="290" y="128" text-anchor="middle" font-size="10">global: AdaptivePool H/4 → bilinear upsample</text>
  <text x="290" y="148" text-anchor="middle" font-size="11" font-style="italic">C = 0.7·local + 0.3·global</text>

  <!-- ===== gate sigmoid ===== -->
  <line x1="400" y1="115" x2="435" y2="115" stroke="#444" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="440" y="70" width="180" height="90" fill="#f4f4f4" stroke="#333" stroke-width="1.3" rx="6"/>
  <text x="530" y="92" text-anchor="middle" font-size="12" font-weight="bold">Pixel gate</text>
  <text x="530" y="112" text-anchor="middle" font-size="11" font-style="italic">g = σ((τ − C)·T)</text>
  <text x="530" y="130" text-anchor="middle" font-size="10">τ = 0.3,  T = 10.0</text>
  <text x="530" y="148" text-anchor="middle" font-size="10">→ 3×3 Gaussian smooth</text>

  <!-- ===== C1-MS context ===== -->
  <line x1="620" y1="115" x2="655" y2="115" stroke="#444" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="660" y="55" width="260" height="120" fill="#f3e8ff" stroke="#7b3fa0" stroke-width="1.3" rx="6"/>
  <text x="790" y="77" text-anchor="middle" font-size="12" font-weight="bold">C1-MS context gate (optional, zero-param)</text>
  <text x="790" y="97" text-anchor="middle" font-size="10">scales k ∈ {3, 5, 9}, weights (0.5, 0.3, 0.2)</text>
  <text x="790" y="113" text-anchor="middle" font-size="10">neighbors: n=4, κ=2.0, coord Gaussian + conflict decay</text>
  <text x="790" y="133" text-anchor="middle" font-size="11" font-style="italic">g_ctx^ms = Σ w_s · g_ctx^(s)</text>
  <text x="790" y="153" text-anchor="middle" font-size="11" font-style="italic">ĝ = γ·g + (1−γ)·g_ctx^ms</text>
  <text x="790" y="168" text-anchor="middle" font-size="10" fill="#666">γ = 1.0 → context branch disabled</text>

  <!-- conflict feeds C1-MS -->
  <path d="M 130 130 Q 300 190 660 150" stroke="#b8860b" stroke-width="1.1" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)"/>

  <!-- ===== fallback 0.5 avg ===== -->
  <line x1="130" y1="255" x2="175" y2="255" stroke="#2c5fa8" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="130" y1="355" x2="175" y2="355" stroke="#a82c2c" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="180" y="270" width="180" height="80" fill="#f4f4f4" stroke="#333" stroke-width="1.3" rx="6"/>
  <text x="270" y="295" text-anchor="middle" font-size="12" font-weight="bold">Equal-weight fallback</text>
  <text x="270" y="318" text-anchor="middle" font-size="11" font-style="italic">M_05 = 0.5·T + 0.5·S</text>
  <text x="270" y="338" text-anchor="middle" font-size="10" fill="#666">conservative blend at high conflict</text>

  <!-- ===== final fusion ===== -->
  <rect x="970" y="200" width="200" height="120" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="6"/>
  <text x="1070" y="228" text-anchor="middle" font-size="13" font-weight="bold">Final pixel map M</text>
  <text x="1070" y="255" text-anchor="middle" font-size="11" font-style="italic">M = ĝ·M_PFB + (1−ĝ)·M_05</text>
  <text x="1070" y="282" text-anchor="middle" font-size="10" fill="#666">low conflict → learned evidence fusion</text>
  <text x="1070" y="298" text-anchor="middle" font-size="10" fill="#666">high conflict → equal-weight fallback</text>

  <!-- gate to fusion -->
  <line x1="920" y1="115" x2="970" y2="230" stroke="#7b3fa0" stroke-width="1.3" marker-end="url(#arr)"/>
  <!-- PFB to fusion -->
  <line x1="130" y1="455" x2="970" y2="270" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arrg)"/>
  <!-- fallback to fusion -->
  <line x1="360" y1="310" x2="970" y2="290" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- legend / notes -->
  <line x1="30" y1="510" x2="1170" y2="510" stroke="#ccc" stroke-width="0.8"/>
  <text x="30" y="535" font-size="11" fill="#444" font-weight="bold">Design notes:</text>
  <text x="30" y="555" font-size="10.5" fill="#444">• Gate g∈[0,1]: g≈1 adopts PFB evidence result; g≈0 falls back to 0.5 tex/sem blend. 3×3 Gaussian smoothing removes salt-and-pepper oscillation in the gate map.</text>
  <text x="30" y="573" font-size="10.5" fill="#444">• C1-MS context candidate: within k×k window, neighbors weighted by 2D coordinate Gaussian and conflict decay exp(−κ·c_norm); top-4 neighbors retained, renormalized. Three scales fused at (0.5, 0.3, 0.2).</text>
  <text x="30" y="591" font-size="10.5" fill="#444">• All operators are rule-based; no trainable layer, no nn.Parameter in CAPGF or C1-MS. γ=1.0 keeps C1-MS off and output bit-identical to the single-scale gate.</text>
  <text x="30" y="609" font-size="10.5" fill="#444">• Gate does not decide normal/abnormal directly; it selects between learned fusion and conservative blend on pixels where two branches disagree, suppressing false positives from texture fluctuation.</text>
</svg>
