<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" font-family="DejaVu Serif, serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c5fa8"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a82c2c"/>
    </marker>
    <linearGradient id="texHeat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8f0fb"/><stop offset="100%" stop-color="#2c5fa8"/>
    </linearGradient>
    <linearGradient id="semHeat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbe8e8"/><stop offset="100%" stop-color="#a82c2c"/>
    </linearGradient>
    <linearGradient id="confHeat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8d6"/><stop offset="100%" stop-color="#e8a020"/>
    </linearGradient>
  </defs>

  <text x="600" y="28" text-anchor="middle" font-size="17" font-weight="bold">CBE: from scalar anomaly maps to discounted (N, A, U) evidence</text>

  <!-- ============ (a) tex branch ============ -->
  <text x="40" y="65" font-size="13" font-weight="bold" fill="#2c5fa8">(a) Texture branch (PatchCore distance)</text>

  <!-- tex input heatmap -->
  <rect x="40" y="80" width="90" height="90" fill="url(#texHeat)" stroke="#2c5fa8" stroke-width="1.2" rx="3"/>
  <circle cx="100" cy="130" r="14" fill="#2c5fa8" opacity="0.7"/>
  <circle cx="75" cy="110" r="6" fill="#5a82c4" opacity="0.6"/>
  <text x="85" y="188" text-anchor="middle" font-size="11">T(p): long-tailed</text>
  <text x="85" y="202" text-anchor="middle" font-size="10" fill="#666">small values ~0, tail to 3+</text>

  <line x1="130" y1="125" x2="165" y2="125" stroke="#444" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- tex encoder -->
  <rect x="170" y="80" width="150" height="90" fill="#eaf2fb" stroke="#2c5fa8" stroke-width="1.3" rx="6"/>
  <text x="245" y="100" text-anchor="middle" font-size="12" font-weight="bold">tex_encoder</text>
  <text x="245" y="118" text-anchor="middle" font-size="10">Conv3×3 1→16 +LN+GELU</text>
  <text x="245" y="133" text-anchor="middle" font-size="10">Conv3×3 16→16 +LN+GELU</text>
  <text x="245" y="148" text-anchor="middle" font-size="10">Conv1×1 16→3 +Softplus</text>
  <text x="245" y="165" text-anchor="middle" font-size="10" fill="#666">L1 normalize over channels</text>

  <line x1="320" y1="125" x2="355" y2="125" stroke="#444" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- evidence bar: N/A/U stacked -->
  <text x="430" y="95" text-anchor="middle" font-size="11" font-weight="bold">tex evidence (per pixel)</text>
  <!-- normal pixel example -->
  <text x="365" y="118" font-size="10">normal px</text>
  <rect x="430" y="108" width="120" height="14" fill="#4a90d9"/>
  <rect x="430" y="108" width="8" height="14" fill="#d94a4a"/>
  <rect x="438" y="108" width="0" height="14" fill="#bbb"/>
  <text x="555" y="119" font-size="9" fill="#4a90d9">m_N≈0.85</text>
  <!-- abnormal pixel -->
  <text x="365" y="143" font-size="10">abnormal px</text>
  <rect x="430" y="133" width="120" height="14" fill="#4a90d9" opacity="0.3"/>
  <rect x="430" y="133" width="80" height="14" fill="#d94a4a"/>
  <rect x="510" y="133" width="40" height="14" fill="#bbb"/>
  <text x="555" y="144" font-size="9" fill="#d94a4a">m_A≈0.66</text>
  <text x="490" y="165" text-anchor="middle" font-size="9" fill="#666">m_N(blue) / m_A(red) / m_U(gray), sum=1</text>

  <!-- ============ (b) sem branch ============ -->
  <text x="40" y="255" font-size="13" font-weight="bold" fill="#a82c2c">(b) Semantic branch (CLIP cosine similarity, frozen CMGL)</text>

  <rect x="40" y="270" width="90" height="90" fill="url(#semHeat)" stroke="#a82c2c" stroke-width="1.2" rx="3"/>
  <rect x="55" y="290" width="60" height="50" fill="#a82c2c" opacity="0.25"/>
  <text x="85" y="378" text-anchor="middle" font-size="11">S(p): Gaussian-like</text>
  <text x="85" y="392" text-anchor="middle" font-size="10" fill="#666">peaked near 0.4–0.6</text>

  <line x1="130" y1="315" x2="165" y2="315" stroke="#444" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="170" y="270" width="150" height="90" fill="#fbeaea" stroke="#a82c2c" stroke-width="1.3" rx="6"/>
  <text x="245" y="290" text-anchor="middle" font-size="12" font-weight="bold">sem_encoder</text>
  <text x="245" y="308" text-anchor="middle" font-size="10">Conv3×3 1→16 +LN+GELU</text>
  <text x="245" y="323" text-anchor="middle" font-size="10">Conv3×3 16→16 +LN+GELU</text>
  <text x="245" y="338" text-anchor="middle" font-size="10">Conv1×1 16→3 +Softplus</text>
  <text x="245" y="355" text-anchor="middle" font-size="10" fill="#666">same arch, no weight sharing</text>

  <line x1="320" y1="315" x2="355" y2="315" stroke="#444" stroke-width="1.3" marker-end="url(#arr)"/>

  <text x="430" y="285" text-anchor="middle" font-size="11" font-weight="bold">sem evidence (per pixel)</text>
  <text x="365" y="308" font-size="10">normal px</text>
  <rect x="430" y="298" width="120" height="14" fill="#4a90d9"/>
  <rect x="430" y="298" width="10" height="14" fill="#d94a4a"/>
  <text x="555" y="309" font-size="9" fill="#4a90d9">m_N≈0.83</text>
  <text x="365" y="333" font-size="10">abnormal px</text>
  <rect x="430" y="323" width="120" height="14" fill="#4a90d9" opacity="0.3"/>
  <rect x="430" y="323" width="75" height="14" fill="#d94a4a"/>
  <rect x="505" y="323" width="45" height="14" fill="#bbb"/>
  <text x="555" y="334" font-size="9" fill="#d94a4a">m_A≈0.63</text>

  <!-- ============ (c) conflict ============ -->
  <text x="680" y="65" font-size="13" font-weight="bold" fill="#b8860b">(c) Conflict-driven discount</text>

  <!-- conflict heatmap -->
  <rect x="680" y="80" width="110" height="90" fill="url(#confHeat)" stroke="#b8860b" stroke-width="1.2" rx="3"/>
  <circle cx="735" cy="125" r="20" fill="#e87020" opacity="0.8"/>
  <circle cx="710" cy="105" r="8" fill="#e8a020" opacity="0.6"/>
  <text x="735" y="188" text-anchor="middle" font-size="11">Conflict K(p)</text>
  <text x="735" y="202" text-anchor="middle" font-size="10" fill="#666">tex says A, sem says N (or vice versa)</text>

  <!-- arrows from evidence to conflict -->
  <path d="M 550 140 Q 620 110 680 120" stroke="#2c5fa8" stroke-width="1.3" fill="none" marker-end="url(#arrb)"/>
  <path d="M 550 330 Q 620 200 700 170" stroke="#a82c2c" stroke-width="1.3" fill="none" marker-end="url(#arrr)"/>

  <!-- stat -->
  <line x1="790" y1="125" x2="825" y2="125" stroke="#444" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="830" y="85" width="150" height="80" fill="#fff8d6" stroke="#b8860b" stroke-width="1.3" rx="6"/>
  <text x="905" y="105" text-anchor="middle" font-size="11" font-weight="bold">4-d stat h</text>
  <text x="905" y="122" text-anchor="middle" font-size="10">mean / std / max of K</text>
  <text x="905" y="137" text-anchor="middle" font-size="10">+ mean(m_U)</text>
  <text x="905" y="158" text-anchor="middle" font-size="10">→ MLP 4→16→1 → α</text>

  <!-- alpha gauge -->
  <line x1="980" y1="125" x2="1015" y2="125" stroke="#444" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="1020" y="85" width="140" height="80" fill="#fff8d6" stroke="#b8860b" stroke-width="1.3" rx="6"/>
  <text x="1090" y="105" text-anchor="middle" font-size="11" font-weight="bold">Discount α</text>
  <rect x="1035" y="118" width="110" height="10" fill="#eee" stroke="#999"/>
  <rect x="1035" y="118" width="80" height="10" fill="#e87020"/>
  <text x="1090" y="145" text-anchor="middle" font-size="10" fill="#666">high conflict → α→1</text>
  <text x="1090" y="158" text-anchor="middle" font-size="10" fill="#666">low conflict → α→0</text>

  <!-- discount bar -->
  <rect x="680" y="230" width="200" height="100" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3" rx="6"/>
  <text x="780" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Evidence discounting</text>
  <text x="780" y="272" text-anchor="middle" font-size="11">m'_c(p) = α · m_c(p),  c∈{N,A}</text>
  <text x="780" y="290" text-anchor="middle" font-size="11">m'_U(p) = 1 − Σ m'_c(p)</text>
  <text x="780" y="312" text-anchor="middle" font-size="10" fill="#666">disputed evidence → "unknown" reserve</text>

  <path d="M 1090 165 L 1090 200 L 780 200 L 780 230" stroke="#2e7d32" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

  <!-- output -->
  <rect x="930" y="240" width="200" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="6"/>
  <text x="1030" y="265" text-anchor="middle" font-size="12" font-weight="bold">Discounted evidence</text>
  <text x="1030" y="285" text-anchor="middle" font-size="11">tex: m'^t_N, m'^t_A, m'^t_U</text>
  <text x="1030" y="303" text-anchor="middle" font-size="11">sem: m'^s_N, m'^s_A, m'^s_U</text>
  <text x="1030" y="318" text-anchor="middle" font-size="10" fill="#2e7d32">→ PFB (Dempster combination)</text>

  <line x1="880" y1="280" x2="930" y2="280" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- footer notes -->
  <line x1="40" y1="430" x2="1160" y2="430" stroke="#ccc" stroke-width="0.8"/>
  <text x="40" y="455" font-size="11" fill="#444" font-weight="bold">Design notes:</text>
  <text x="40" y="475" font-size="10.5" fill="#444">• Two independent encoders (no weight sharing): tex_encoder fits long-tailed distance map, sem_encoder fits Gaussian similarity map; both output same (N,A,U) simplex for compatible Dempster fusion.</text>
  <text x="40" y="493" font-size="10.5" fill="#444">• Last-layer weights zero-init, bias toward m_U≈0.7: training starts conservative, avoids over-confident wrong evidence on pixel noise.</text>
  <text x="40" y="511" font-size="10.5" fill="#444">• Image-level 4-d conflict stat (not per-pixel K): avoids α jitter; MLP 4→16→1 (~100 params) predicts branch discount so disputed pixels fall into "unknown" instead of forcing a wrong N/A vote.</text>
</svg>
